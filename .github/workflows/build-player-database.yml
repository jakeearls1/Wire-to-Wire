name: Build historical player database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 15 2 *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Wire to Wire
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate historical pools
        run: python scripts/build_data.py

      - name: Commit generated database
        run: |
          git config user.name "wire-to-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seed-pools.js data/seed-pools.report.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Build historical player database"
            git push
          fi
